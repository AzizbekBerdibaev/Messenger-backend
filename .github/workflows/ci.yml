name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: messenger_user
          POSTGRES_PASSWORD: messenger_password
          POSTGRES_DB: messenger_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore MessengerSolution.sln
      
    - name: Build
      run: dotnet build MessengerSolution.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test MessengerSolution.sln --no-build --configuration Release --verbosity normal
      env:
        ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=messenger_db;Username=messenger_user;Password=messenger_password"
        ConnectionStrings__Redis: "localhost:6379"
